<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商实时风险控制系统 · RiskGuard Console</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- ==================== 登录页 PG-00 ==================== -->
<div id="login">
  <div class="box">
    <h1>电商实时风险控制系统</h1>
    <div class="sub">RiskGuard Console · V1.0</div>
    <div class="field"><label>账号</label><input type="text" id="loginUser" value="admin@riskguard.cn"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPwd" placeholder="请输入密码" value="demo123456"></div>
    <div class="login-err" id="loginErr"></div>
    <div class="role-pick" id="rolePick">
      <div class="role" role="button" tabindex="0" data-role="auditor"><span><b>风控审核员</b><small>查看待审案件 · 核对证据链 · 录入复核结论与处置</small></span><span class="tag blue">进入 →</span></div>
      <div class="role" role="button" tabindex="0" data-role="strategist"><span><b>风控策略师</b><small>规则增删改查 · 阈值权重调整 · 名单库维护 · 仿真回测</small></span><span class="tag blue">进入 →</span></div>
      <div class="role" role="button" tabindex="0" data-role="admin"><span><b>系统管理员</b><small>运行配置 · 吞吐与接口健康度监控 · 审计流水查阅</small></span><span class="tag blue">进入 →</span></div>
    </div>
    <button class="btn primary block" id="loginBtn" style="margin-top:16px;padding:9px">登 录</button>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="app">
  <aside>
    <div class="logo">RiskGuard<small>电商实时风控系统</small></div>
    <nav id="sideNav"><!-- 由 app.js 按角色权限动态渲染 --></nav>
    <div class="user">
      当前角色：<b id="curRole">—</b><br>
      <a id="logoutBtn">退出登录</a>
      <div class="realtime"><span class="switch on" id="rtSwitch"></span> 实时推送</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <span class="crumb" id="pageTitle">—</span>
      <span class="spacer"></span>
      <span class="env">环境：DEMO · 模拟事件流运行中</span>
      <span class="tag low"><span class="dot" style="background:var(--low)"></span>引擎正常</span>
    </header>
    <div class="content" id="pageContainer"><!-- 页面由各 page 模块渲染 --></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/workbench.js"></script>
<script src="js/pages/policy.js"></script>
<script src="js/pages/simulate.js"></script>
<script src="js/pages/audit.js"></script>
<script src="js/pages/system.js"></script>
<script src="js/app.js"></script>
</body>
</html>
